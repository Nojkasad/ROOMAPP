name: CI

# Testai paleidžiami kiekvienam pull request į dev arba main
# ir kiekvienam push į šias šakas.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kol technologijos nepatvirtintos ir kodo dar nėra, žingsnis praleidžiamas.
      # Pasirinkus technologijas, šį failą reikės papildyti (pvz., Node.js, Python ar Java).
      - name: Patikrinti, ar yra projektas
        id: detect
        run: |
          if [ -f package.json ]; then echo "kind=node" >> "$GITHUB_OUTPUT"; else echo "kind=none" >> "$GITHUB_OUTPUT"; fi

      - name: Node.js
        if: steps.detect.outputs.kind == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Įdiegti priklausomybes ir paleisti testus
        if: steps.detect.outputs.kind == 'node'
        run: |
          npm ci
          npm test

      - name: Kodo dar nėra
        if: steps.detect.outputs.kind == 'none'
        run: echo "Projekto kodo dar nėra - testai praleidžiami."
